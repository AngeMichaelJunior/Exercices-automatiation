version: '3.9'

services:
  traefik:
    image: traefik:latest
    container_name: demo-traefik
    ports:
      - "8080:80"
      - "8090:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    networks:
      - demo-proxy

  demo-web1:
    image: nginx:1.27-alpine
    container_name: demo-web1
    labels:
      - traefik.enable=true
      - traefik.http.routers.service1.rule=Path(`/service1`)
      - traefik.http.services.service1.loadbalancer.server.port=80
    networks:
      - demo-proxy
    environment:
      NGINX_HOST: localhost
      NGINX_PORT: 80

  demo-web2:
    image: busybox:latest
    container_name: demo-web2
    command: /bin/sh -c "echo 'Service 2 disponible' && nc -l -p 80 -e /bin/cat"
    labels:
      - traefik.enable=true
      - traefik.http.routers.service2.rule=Path(`/service2`)
      - traefik.http.services.service2.loadbalancer.server.port=80
    networks:
      - demo-proxy

networks:
  demo-proxy:
    driver: bridge
