<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Docker Custom Image Demo</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #0f172a, #1d4ed8);
        color: #f8fafc;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(720px, 90vw);
        background: rgba(15, 23, 42, 0.78);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 24px;
        padding: 32px;
        box-shadow: 0 20px 60px rgba(15, 23, 42, 0.35);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 5vw, 3.4rem);
      }

      p {
        line-height: 1.6;
        color: #dbeafe;
      }

      .badge {
        display: inline-block;
        margin-top: 12px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #22c55e;
        color: #052e16;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="badge">Build completed</p>
      <h1>Custom Docker Image</h1>
      <p>This page is copied into the image at build time through the Dockerfile.</p>
      <p>The container now serves custom content instead of the default Nginx welcome page.</p>
    </main>
  </body>
</html>
